services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BASE_URL: https://${DOMAIN:?DOMAIN must be set in .env}
      DB_DRIVER: sqlite
      DB_SQLITE_PATH: /app/data/blog.db
      FILE_BASEPATH: /app/data/uploads
      PORT: 8888
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    volumes:
      - blog_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8888
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8888
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  blog_data:
    name: luna-go-blog-dev-data
